<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karlstad RTG</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f1f4f9;
    --surface: #ffffff;
    --soft: #e9eef6;
    --text: #0b1730;
    --muted: #5a6781;
    --line: #dbe3ee;
    --navy: #0a1f44;
    --green: #8bd94f;
    --accent: #2556b8;
    --accent-soft: #e2ebfb;
    --accent-text: #ffffff;
    --sel-bg: #0a1f44;
    --sel-text: #ffffff;
    --ok: #2f7d1c;
    --ok-soft: #e2f5d2;
    --danger: #c2271d;
    --flash: #e3f7d0;
    --toast-bg: #0a1f44;
    --shadow: 0 1px 2px rgba(10,31,68,.06), 0 1px 3px rgba(10,31,68,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #060f20; --surface: #0d1b36; --soft: #142749; --text: #e8eefb; --muted: #8fa1c2;
      --line: #1e3560; --navy: #10295c; --green: #9be860; --accent: #6f9cf2; --accent-soft: #14284d;
      --accent-text: #0a1f44; --sel-bg: #9be860; --sel-text: #0a1f44; --ok: #a4e871; --ok-soft: #183616;
      --danger: #ff7168; --flash: #1d3d1c; --toast-bg: #17325f; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #060f20; --surface: #0d1b36; --soft: #142749; --text: #e8eefb; --muted: #8fa1c2;
    --line: #1e3560; --navy: #10295c; --green: #9be860; --accent: #6f9cf2; --accent-soft: #14284d;
    --accent-text: #0a1f44; --sel-bg: #9be860; --sel-text: #0a1f44; --ok: #a4e871; --ok-soft: #183616;
    --danger: #ff7168; --flash: #1d3d1c; --toast-bg: #17325f; --shadow: none;
  }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 56px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; background: var(--navy); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: var(--green); color: #0a1f44; display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; flex: none; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.02em; line-height: 1.15; color: #ffffff; }
  .tag { margin: 2px 0 0; color: #b8c7e6; font-size: .88rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .stat:first-child { background: var(--navy); border-color: var(--navy); }
  .stat:first-child b { color: var(--green); }
  .stat:first-child span { color: #b8c7e6; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .add { padding: 16px; margin-bottom: 18px; }
  .addhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .add h2 { margin: 0; font-size: 1rem; }
  .add.sell { background: var(--accent-soft); border-color: var(--accent); }
  .add.sell .fields { grid-template-columns: 1fr auto auto; }
  .add.sell .btn-primary { background: var(--sel-bg); color: var(--sel-text); }
  .fields { display: grid; grid-template-columns: 1.3fr 2fr auto auto auto; gap: 12px; align-items: end; }
  .f label { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin: 0 0 5px; }
  input[type=text] {
    width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 0 12px; min-height: 42px;
  }
  input[type=text]::placeholder { color: #9aa3af; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  #n-sku { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 0 14px; min-height: 36px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-text); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
  .stepper button { border: 0; background: var(--soft); color: var(--text); width: 34px; min-height: 40px; font: inherit; font-size: 1.1rem; cursor: pointer; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper input { width: 44px; border: 0; border-radius: 0; text-align: center; font-weight: 700; padding: 0; min-height: 40px; background: transparent; }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .btn-primary { border: 0; background: var(--green); color: #0a1f44; font: inherit; font-weight: 700; border-radius: 9px; padding: 0 22px; min-height: 42px; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.06); }
  .hint { color: var(--muted); font-size: .84rem; margin-top: 10px; min-height: 1.2em; }
  .hint.warn { color: var(--accent); }

  .listhead { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .listhead h2 { font-size: 1rem; margin: 0 auto 0 0; }
  .search { position: relative; flex: 0 1 240px; }
  .search input { padding-left: 34px; min-height: 38px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .chips { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 3px; }
  .chip { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .86rem; padding: 0 12px; min-height: 32px; border-radius: 7px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-text); }

  table { border-collapse: collapse; width: 100%; }
  thead th { text-align: left; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--line); }
  tbody td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--soft); }
  tr.flash td { background: var(--flash) !important; }
  td.sku { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; overflow-wrap: anywhere; }
  td.date, td.sdate { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  td.sdate { color: var(--text); }
  tr.soldrow td.type { color: var(--muted); }
  td.name input { border: 1px solid transparent; background: transparent; min-height: 36px; padding: 0 8px; margin: 0 -8px; width: calc(100% + 16px); }
  td.name input:hover { border-color: var(--line); }
  td.name input:focus { background: var(--surface); }
  .pill { border: 0; border-radius: 999px; background: var(--soft); color: var(--text); font: inherit; font-size: .8rem; font-weight: 600; padding: 4px 10px; min-height: 30px; cursor: pointer; }
  td.act { text-align: right; white-space: nowrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; border-radius: 8px; padding: 0 12px; min-height: 34px; cursor: pointer; }
  .btn.sell { color: var(--ok); background: var(--ok-soft); border-color: transparent; font-weight: 700; }
  .btn.sell:hover { filter: brightness(.96); }
  .btn.rm { color: var(--muted); width: 34px; padding: 0; margin-left: 6px; }
  .btn.rm:hover { color: var(--danger); border-color: var(--danger); }
  .btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .stepper button:focus-visible, .pill:focus-visible, .btn-primary:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { text-align: center; padding: 44px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 1.02rem; margin-bottom: 4px; }
  .foot { margin-top: 14px; color: var(--muted); font-size: .8rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .ghost { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; border-radius: 8px; padding: 0 12px; min-height: 34px; cursor: pointer; }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--toast-bg); color: #ffffff; padding: 9px 9px 9px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 92vw; z-index: 10; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #toast button { background: transparent; color: var(--green); border: 1px solid currentColor; border-radius: 7px; font: inherit; font-weight: 700; padding: 4px 12px; cursor: pointer; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .fields, .add.sell .fields { grid-template-columns: 1fr 1fr; }
    .add.sell .fields .f:first-child { grid-column: 1 / -1; }
    .fields .f.wide { grid-column: 1 / -1; }
    .btn-primary { grid-column: 1 / -1; }
    thead { display: none; }
    table, tbody { display: block; }
    tbody tr { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "sku type" "name name" "qty act"; align-items: center; gap: 6px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    tbody tr.soldrow { grid-template-areas: "sku type" "name name" "sdate act"; }
    tbody tr:last-child { border-bottom: 0; }
    tbody td { padding: 0; border: 0; background: transparent !important; }
    td.sku { grid-area: sku; }
    td.type { grid-area: type; justify-self: end; }
    td.name { grid-area: name; }
    td.qtyc { grid-area: qty; }
    td.sdate { grid-area: sdate; }
    td.act { grid-area: act; }
    td.date { display: none; }
    tbody tr.emptyrow { display: block; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">RTG</div>
    <div>
      <h1>Karlstad RTG</h1>
      <p class="tag">Precalibrated TVs and laptops in stock</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="card add" id="entry-card" aria-label="Add or sell">
    <div class="addhead">
      <h2 id="entry-title">Add stock</h2>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="m-add" aria-pressed="true">Add stock</button>
        <button type="button" id="m-sell" aria-pressed="false">Sell</button>
      </div>
    </div>
    <div class="fields">
      <div class="f"><label for="n-sku">SKU</label><input type="text" id="n-sku" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Scan or type SKU" autofocus></div>
      <div class="f wide" id="f-name"><label for="n-name">Product name</label><input type="text" id="n-name" autocomplete="off" maxlength="160" placeholder="e.g. 55&quot; OLED TV"></div>
      <div class="f" id="f-type"><label>Type</label>
        <div class="seg" role="group" aria-label="Type">
          <button type="button" id="t-tv" aria-pressed="true">TV</button>
          <button type="button" id="t-laptop" aria-pressed="false">Laptop</button>
        </div>
      </div>
      <div class="f"><label>Qty</label><div id="n-qty-slot"></div></div>
      <button type="button" class="btn-primary" id="add">Add to stock</button>
    </div>
    <div class="hint" id="hint" aria-live="polite">Press Enter to add. Adding an existing SKU increases its quantity.</div>
  </section>

  <section class="card" aria-label="Stock">
    <div class="listhead">
      <div class="chips" id="tabs" role="tablist" aria-label="View"></div>
      <div class="chips" id="chips" style="margin-left:auto"></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="search" autocomplete="off" placeholder="Search" aria-label="Search SKU or product name">
      </div>
    </div>
    <table id="stock-table">
      <thead><tr><th>SKU</th><th>Product name</th><th>Type</th><th>Qty</th><th>Added</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <table id="sold-table" hidden>
      <thead><tr><th>Sold</th><th>SKU</th><th>Product name</th><th>Type</th><th></th></tr></thead>
      <tbody id="sold-rows"></tbody>
    </table>
  </section>

  <div class="foot">
    <span id="storage"></span>
    <button type="button" class="ghost" id="export" hidden>Export CSV</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var LS_KEY = "calibration-tracker:units";
  var LS_SALES = "calibration-tracker:sales";
  var units = [];            // [{id, sku, name, type, qty, ts}]
  var sales = [];            // [{id, sku, name, type, ts}] one entry per unit sold
  var view = "stock";
  var dbCol = null, dbSales = null, mode = "local", downloads = null;
  var typeFilter = "all", query = "", flashId = null, newType = "tv";
  var entry = "add", autoFilled = false;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s || "").trim().toUpperCase(); }
  function qtyOf(u) { var n = parseInt(u.qty, 10); return isNaN(n) ? 1 : n; }
  function fmtDateTime(iso) { try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
  function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); } catch (e) { return ""; } }
  function findBySku(sku) { for (var i = 0; i < units.length; i++) if (units[i].sku === sku) return units[i]; return null; }
  function typeLabel(t) { return t === "tv" ? "TV" : "Laptop"; }

  // ---------- toast ----------
  var toastTimer;
  function toast(msg, actionLabel, onAction) {
    var t = $("toast"); t.textContent = "";
    t.appendChild(el("span", null, msg));
    if (actionLabel) {
      var b = el("button", null, actionLabel); b.type = "button";
      b.onclick = function () { t.classList.remove("show"); onAction(); };
      t.appendChild(b);
    }
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, actionLabel ? 6000 : 2600);
  }

  // ---------- storage ----------
  function loadLocal() {
    try { var raw = localStorage.getItem(LS_KEY); units = raw ? JSON.parse(raw) : []; if (!Array.isArray(units)) units = []; }
    catch (e) { units = []; }
    try { var rs = localStorage.getItem(LS_SALES); sales = rs ? JSON.parse(rs) : []; if (!Array.isArray(sales)) sales = []; }
    catch (e) { sales = []; }
  }
  function saveLocalSales() { try { localStorage.setItem(LS_SALES, JSON.stringify(sales)); } catch (e) { toast("Couldn't save in this browser."); } }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(units)); } catch (e) { toast("Couldn't save in this browser."); } }
  function persistSet(u) {
    if (mode === "db" && dbCol) return dbCol.doc(u.id).set(u).catch(function () { toast("Couldn't save. You may have view-only access."); });
    var found = false;
    units = units.map(function (x) { if (x.id === u.id) { found = true; return u; } return x; });
    if (!found) units.push(u);
    saveLocal(); render(); return Promise.resolve();
  }
  function persistUpdate(id, patch) {
    if (mode === "db" && dbCol) return dbCol.doc(id).update(patch).catch(function () { toast("Couldn't update."); });
    units = units.map(function (u) { return u.id === id ? Object.assign({}, u, patch) : u; });
    saveLocal(); render(); return Promise.resolve();
  }
  function persistDelete(id) {
    if (mode === "db" && dbCol) return dbCol.doc(id).delete().catch(function () { toast("Couldn't delete."); });
    units = units.filter(function (u) { return u.id !== id; });
    saveLocal(); render(); return Promise.resolve();
  }

  function persistSaleSet(sale) {
    if (mode === "db" && dbSales) return dbSales.doc(sale.id).set(sale).catch(function () { toast("Couldn't save the sale record."); });
    sales = sales.filter(function (x) { return x.id !== sale.id; }); sales.push(sale);
    saveLocalSales(); render(); return Promise.resolve();
  }
  function persistSaleDelete(id) {
    if (mode === "db" && dbSales) return dbSales.doc(id).delete().catch(function () { toast("Couldn't update sold history."); });
    sales = sales.filter(function (x) { return x.id !== id; });
    saveLocalSales(); render(); return Promise.resolve();
  }

  // ---------- stepper ----------
  function makeStepper(initial, onCommit, label) {
    var wrap = el("div", "stepper");
    var minus = el("button", null, "\u2212"); minus.type = "button"; minus.setAttribute("aria-label", "Decrease " + label);
    var plus = el("button", null, "+"); plus.type = "button"; plus.setAttribute("aria-label", "Increase " + label);
    var inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "numeric"; inp.value = String(initial);
    inp.setAttribute("aria-label", label); inp.autocomplete = "off";
    function val() { var n = parseInt(inp.value, 10); return isNaN(n) ? NaN : n; }
    function sync() { var n = val(); minus.disabled = !(n > 1); }
    minus.onclick = function () { var n = val(); if (n > 1) { inp.value = String(n - 1); sync(); onCommit(n - 1, inp); } };
    plus.onclick = function () { var n = val(); n = isNaN(n) ? 1 : n; inp.value = String(n + 1); sync(); onCommit(n + 1, inp); };
    inp.addEventListener("change", function () { sync(); onCommit(val(), inp); });
    inp.addEventListener("input", sync);
    wrap.appendChild(minus); wrap.appendChild(inp); wrap.appendChild(plus);
    sync();
    return { el: wrap, input: inp, get: val, set: function (n) { inp.value = String(n); sync(); } };
  }

  // ---------- rendering ----------
  function renderStats() {
    var total = 0, tv = 0, lap = 0;
    units.forEach(function (u) { var q = qtyOf(u); total += q; if (u.type === "tv") tv += q; else lap += q; });
    var s = $("stats"); s.textContent = "";
    [["Units in stock", total], ["TVs", tv], ["Laptops", lap], ["Different SKUs", units.length], ["Sold", sales.length]].forEach(function (p) {
      var d = el("div", "stat"); d.appendChild(el("b", null, String(p[1]))); d.appendChild(el("span", null, p[0])); s.appendChild(d);
    });
  }

  function renderChips() {
    var c = $("chips"); c.textContent = "";
    [["all", "All"], ["tv", "TVs"], ["laptop", "Laptops"]].forEach(function (p) {
      var b = el("button", "chip", p[1]); b.type = "button";
      b.setAttribute("aria-pressed", String(typeFilter === p[0]));
      b.onclick = function () { typeFilter = p[0]; renderChips(); renderView(); };
      c.appendChild(b);
    });
  }

  function renderTabs() {
    var total = 0; units.forEach(function (u) { total += qtyOf(u); });
    var c = $("tabs"); c.textContent = "";
    [["stock", "In stock (" + total + ")"], ["sold", "Sold (" + sales.length + ")"]].forEach(function (p) {
      var b = el("button", "chip", p[1]); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-pressed", String(view === p[0])); b.setAttribute("aria-selected", String(view === p[0]));
      b.onclick = function () { view = p[0]; renderTabs(); renderView(); };
      c.appendChild(b);
    });
  }

  function renderView() {
    var sold = view === "sold";
    $("stock-table").hidden = sold; $("sold-table").hidden = !sold;
    if (sold) renderSold(); else renderRows();
    renderStorage();
  }

  function renderSold() {
    var body = $("sold-rows"); body.textContent = "";
    var q = query.trim().toLowerCase();
    var rows = sales.filter(function (s) {
      if (typeFilter !== "all" && s.type !== typeFilter) return false;
      if (!q) return true;
      return (s.sku || "").toLowerCase().indexOf(q) !== -1 || (s.name || "").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return (b.ts || "") < (a.ts || "") ? -1 : 1; });

    if (!rows.length) {
      var tr = el("tr", "emptyrow"), td = el("td", "empty"); td.colSpan = 5;
      td.appendChild(el("b", null, sales.length ? "No matches" : "No sales yet"));
      td.appendChild(document.createTextNode(sales.length ? "Try a different search or filter." : "When you press Mark sold, the sale shows up here with the date and time."));
      tr.appendChild(td); body.appendChild(tr); return;
    }
    rows.forEach(function (s) {
      var tr = el("tr", "soldrow");
      tr.appendChild(el("td", "sdate", fmtDateTime(s.ts)));
      tr.appendChild(el("td", "sku", s.sku));
      tr.appendChild(el("td", "name", s.name || "\u2014"));
      tr.appendChild(el("td", "type", typeLabel(s.type)));
      var act = el("td", "act");
      var b = el("button", "btn", "Return to stock"); b.type = "button";
      b.title = "Put this unit back in stock and remove it from the sold list";
      b.setAttribute("aria-label", "Return " + s.sku + " to stock");
      b.onclick = function () { returnToStock(s); };
      act.appendChild(b); tr.appendChild(act);
      body.appendChild(tr);
    });
  }

  function renderRows() {
    var body = $("rows"); body.textContent = "";
    var q = query.trim().toLowerCase();
    var rows = units.filter(function (u) {
      if (typeFilter !== "all" && u.type !== typeFilter) return false;
      if (!q) return true;
      return (u.sku || "").toLowerCase().indexOf(q) !== -1 || (u.name || "").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return (b.ts || "") < (a.ts || "") ? -1 : 1; });

    if (!rows.length) {
      var tr = el("tr", "emptyrow"), td = el("td", "empty"); td.colSpan = 6;
      td.appendChild(el("b", null, units.length ? "No matches" : "Nothing in stock yet"));
      td.appendChild(document.createTextNode(units.length ? "Try a different search or filter." : "Add your first product above to get started."));
      tr.appendChild(td); body.appendChild(tr); return;
    }

    rows.forEach(function (u) {
      var tr = el("tr", u.id === flashId ? "flash" : ""); tr.dataset.id = u.id;
      tr.appendChild(el("td", "sku", u.sku));

      var tn = el("td", "name"), ni = document.createElement("input");
      ni.type = "text"; ni.value = u.name || ""; ni.placeholder = "Add a name"; ni.autocomplete = "off"; ni.maxLength = 160;
      ni.setAttribute("aria-label", "Product name for " + u.sku);
      ni.addEventListener("change", function () { persistUpdate(u.id, { name: ni.value.trim() }); });
      ni.addEventListener("keydown", function (e) { if (e.key === "Enter") ni.blur(); });
      tn.appendChild(ni); tr.appendChild(tn);

      var tt = el("td", "type"), sel = document.createElement("select"); sel.className = "pill";
      sel.setAttribute("aria-label", "Type for " + u.sku);
      [["tv", "TV"], ["laptop", "Laptop"]].forEach(function (p) { var o = el("option", null, p[1]); o.value = p[0]; if (p[0] === u.type) o.selected = true; sel.appendChild(o); });
      sel.onchange = function () { persistUpdate(u.id, { type: sel.value }); };
      tt.appendChild(sel); tr.appendChild(tt);

      var tq = el("td", "qtyc");
      var st = makeStepper(qtyOf(u), function (n, inp) {
        if (isNaN(n) || n < 0) { inp.value = String(qtyOf(u)); toast("Enter a whole number."); return; }
        if (n === 0) { removeUnit(u); return; }
        persistUpdate(u.id, { qty: n });
      }, "quantity for " + u.sku);
      tq.appendChild(st.el); tr.appendChild(tq);

      tr.appendChild(el("td", "date", fmtDate(u.ts)));

      var act = el("td", "act");
      var sell = el("button", "btn sell", "Mark sold"); sell.type = "button";
      sell.title = "Take one unit out of stock"; sell.setAttribute("aria-label", "Mark one " + u.sku + " as sold");
      sell.onclick = function () { sellOne(u); };
      var rm = el("button", "btn rm", "\u2715"); rm.type = "button";
      rm.title = "Remove this SKU from the list"; rm.setAttribute("aria-label", "Remove " + u.sku);
      rm.onclick = function () { removeUnit(u); };
      act.appendChild(sell); act.appendChild(rm); tr.appendChild(act);

      body.appendChild(tr);
    });

    if (flashId) {
      var f = body.querySelector('[data-id="' + flashId + '"]'), fid = flashId; flashId = null;
      setTimeout(function () { var n = body.querySelector('[data-id="' + fid + '"]'); if (n) n.classList.remove("flash"); }, 1400);
      if (f && f.scrollIntoView) f.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function renderStorage() {
    $("storage").textContent = mode === "db" ? "Synced and saved with this page." : "Saved in this browser only.";
    $("export").hidden = !downloads || !(view === "sold" ? sales.length : units.length);
  }

  function knownInfo(sku) {
    var u = findBySku(sku);
    if (u) return { name: u.name || "", type: u.type };
    var best = null;
    sales.forEach(function (x) { if (x.sku === sku && (!best || (x.ts || "") > (best.ts || ""))) best = x; });
    return best ? { name: best.name || "", type: best.type } : null;
  }

  function updateHint() {
    var sku = norm($("n-sku").value), h = $("hint"), u = sku ? findBySku(sku) : null;
    if (entry === "sell") {
      if (!sku) { h.className = "hint"; h.textContent = "Scan or type a SKU and press Enter to sell one unit."; return; }
      if (u) { h.className = "hint warn"; h.textContent = (u.name ? u.name + " \u00b7 " : "") + qtyOf(u) + " in stock."; }
      else { h.className = "hint"; h.textContent = sku + " isn't in stock."; }
      return;
    }
    if (!sku) { h.className = "hint"; h.textContent = "Press Enter to add. Adding an existing SKU increases its quantity."; return; }
    if (u) { h.className = "hint warn"; h.textContent = sku + " is already in stock (" + qtyOf(u) + "). Adding will increase its quantity."; }
    else { h.className = "hint"; h.textContent = knownInfo(sku) ? "Known SKU. Name and type filled in for you." : "New SKU."; }
  }

  function autofill() {
    if (entry !== "add") return;
    var sku = norm($("n-sku").value), nameEl = $("n-name"), info = sku ? knownInfo(sku) : null;
    if (info) {
      if (!nameEl.value.trim() || autoFilled) { nameEl.value = info.name || ""; if (info.type) setType(info.type); autoFilled = true; }
    } else if (autoFilled) { nameEl.value = ""; autoFilled = false; }
  }

  function setEntry(m) {
    entry = m;
    var sell = m === "sell";
    $("m-add").setAttribute("aria-pressed", String(!sell));
    $("m-sell").setAttribute("aria-pressed", String(sell));
    $("entry-card").classList.toggle("sell", sell);
    $("entry-title").textContent = sell ? "Sell a product" : "Add stock";
    $("add").textContent = sell ? "Mark sold" : "Add to stock";
    $("f-name").hidden = sell; $("f-type").hidden = sell;
    if (sell && autoFilled) { $("n-name").value = ""; }
    autoFilled = false;
    updateHint();
    $("n-sku").focus();
  }

  function render() { renderStats(); renderTabs(); renderChips(); renderView(); updateHint(); }

  // ---------- actions ----------
  var nQty;
  function setType(t) {
    newType = t;
    $("t-tv").setAttribute("aria-pressed", String(t === "tv"));
    $("t-laptop").setAttribute("aria-pressed", String(t === "laptop"));
  }

  function addUnit() {
    var skuEl = $("n-sku"), sku = norm(skuEl.value);
    if (!sku) { toast("Enter a SKU first."); skuEl.focus(); return; }
    var qty = nQty.get();
    if (isNaN(qty) || qty < 1) { toast("Quantity must be 1 or more."); nQty.input.focus(); return; }
    var name = $("n-name").value.trim(), existing = findBySku(sku);
    typeFilter = "all"; query = ""; $("search").value = "";

    if (existing) {
      var patch = { qty: qtyOf(existing) + qty };
      if (!existing.name && name) patch.name = name;
      flashId = existing.id;
      persistUpdate(existing.id, patch);
      toast("Added " + qty + " \u00d7 " + sku + " (now " + patch.qty + ")");
    } else {
      var u = { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sku: sku, name: name, type: newType, qty: qty, ts: new Date().toISOString() };
      flashId = u.id; persistSet(u); toast("Added " + sku);
    }
    skuEl.value = ""; $("n-name").value = ""; nQty.set(1); autoFilled = false;
    updateHint(); skuEl.focus();
  }

  function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function sellUnits(u, n) {
    var prev = Object.assign({}, u), q = qtyOf(u), now = new Date().toISOString(), made = [];
    for (var i = 0; i < n; i++) made.push({ id: newId("s"), sku: u.sku, name: u.name || "", type: u.type, ts: now });
    if (q > n) persistUpdate(u.id, { qty: q - n }); else persistDelete(u.id);
    made.forEach(function (x) { persistSaleSet(x); });
    toast("Sold " + n + " \u00d7 " + u.sku + (q > n ? " (" + (q - n) + " left)" : " (none left)"), "Undo", function () {
      made.forEach(function (x) { persistSaleDelete(x.id); });
      persistSet(prev);
    });
  }
  function sellOne(u) { sellUnits(u, 1); }

  function sellEntry() {
    var skuEl = $("n-sku"), sku = norm(skuEl.value);
    if (!sku) { toast("Scan or type a SKU first."); skuEl.focus(); return; }
    var qty = nQty.get();
    if (isNaN(qty) || qty < 1) { toast("Quantity must be 1 or more."); nQty.input.focus(); return; }
    var u = findBySku(sku);
    if (!u) { toast(sku + " isn't in stock."); skuEl.select(); return; }
    if (qty > qtyOf(u)) { toast("Only " + qtyOf(u) + " of " + sku + " in stock."); nQty.input.focus(); return; }
    sellUnits(u, qty);
    skuEl.value = ""; nQty.set(1); updateHint(); skuEl.focus();
  }

  function submitEntry() { if (entry === "sell") sellEntry(); else addUnit(); }

  function returnToStock(sale) {
    var ex = findBySku(sale.sku);
    if (ex) {
      var patch = { qty: qtyOf(ex) + 1 };
      if (!ex.name && sale.name) patch.name = sale.name;
      persistUpdate(ex.id, patch);
    } else {
      persistSet({ id: newId("u"), sku: sale.sku, name: sale.name || "", type: sale.type, qty: 1, ts: new Date().toISOString() });
    }
    persistSaleDelete(sale.id);
    toast("Returned " + sale.sku + " to stock");
  }
  function removeUnit(u) {
    var prev = Object.assign({}, u);
    persistDelete(u.id);
    toast("Removed " + u.sku, "Undo", function () { persistSet(prev); });
  }

  function csvCell(v) { v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
  function exportCsv() {
    if (!downloads) return;
    var lines, filename;
    if (view === "sold") {
      filename = "karlstad-rtg-sold.csv";
      lines = [["Sold date", "SKU", "Product name", "Type"].map(csvCell).join(",")];
      sales.slice().sort(function (a, b) { return (b.ts || "") < (a.ts || "") ? -1 : 1; }).forEach(function (x) {
        lines.push([x.ts, x.sku, x.name, typeLabel(x.type)].map(csvCell).join(","));
      });
    } else {
      filename = "karlstad-rtg-stock.csv";
      lines = [["SKU", "Product name", "Type", "Qty", "Added"].map(csvCell).join(",")];
      units.slice().sort(function (a, b) { return a.sku < b.sku ? -1 : 1; }).forEach(function (u) {
        lines.push([u.sku, u.name, typeLabel(u.type), qtyOf(u), u.ts].map(csvCell).join(","));
      });
    }
    downloads.save({ filename: filename, data: lines.join("\r\n") })
      .catch(function (e) { if (!e || e.code !== "declined") toast("Export isn't available here."); });
  }

  // ---------- wiring ----------
  nQty = makeStepper(1, function () {}, "new quantity");
  $("n-qty-slot").appendChild(nQty.el);
  $("t-tv").onclick = function () { setType("tv"); };
  $("t-laptop").onclick = function () { setType("laptop"); };
  $("add").onclick = submitEntry;
  $("m-add").onclick = function () { setEntry("add"); };
  $("m-sell").onclick = function () { setEntry("sell"); };
  ["n-sku", "n-name"].forEach(function (id) {
    $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submitEntry(); } });
  });
  nQty.input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submitEntry(); } });
  $("n-sku").addEventListener("input", function () { autofill(); updateHint(); });
  $("n-name").addEventListener("input", function () { autoFilled = false; });
  $("search").addEventListener("input", function (e) { query = e.target.value; renderView(); });
  $("export").onclick = exportCsv;

  loadLocal();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (db) {
      if (!db) return;
      dbCol = db.collection("units"); mode = "db";
      dbSales = db.collection("sales");
      dbSales.onSnapshot(function (snap) {
        sales = snap.docs.map(function (d) { return d.data(); }).filter(Boolean);
        render();
      }, function () { dbSales = null; });
      dbCol.onSnapshot(function (snap) {
        units = snap.docs.map(function (d) { return d.data(); }).filter(Boolean);
        render();
      }, function () { mode = "local"; dbCol = null; dbSales = null; loadLocal(); render(); });
    }).catch(function () {});
    window.claude.use("downloads").then(function (d) { downloads = d || null; renderStorage(); }).catch(function () {});
  }
})();
</script>
</body>
</html>
